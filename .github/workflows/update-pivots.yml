name: Update pivot data

on:
  schedule:
    - cron: '0 3 * * *'   # каждый день в 3:00 UTC
  workflow_dispatch:        # ручной запуск из GitHub UI

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Get nfinite token from Worker
        id: token
        run: |
          TOKEN=$(curl -sf -H "X-Viser-Key: ${{ secrets.WORKER_KEY }}" https://model-replacer.kofein3d.workers.dev)
          if [ -z "$TOKEN" ]; then echo "Worker returned empty token"; exit 1; fi
          echo "::add-mask::$TOKEN"
          echo "value=$TOKEN" >> $GITHUB_OUTPUT

      - name: Fetch pivot data from nfinite
        env:
          NFINITE_TOKEN: ${{ steps.token.outputs.value }}
        run: node check_actual_data/generate-pivot-json.mjs public/pivot-data.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/pivot-data.json
          if git diff --cached --quiet; then
            echo "No changes in pivot data"
          else
            git commit -m "chore: update pivot data"
            git push
          fi

      - name: Deploy to GitHub Pages
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm install
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
